<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物料庫存明細</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <div id="status-bar">⏳ 物料庫存系統已就緒</div>

    <h2>
        <span>📊 庫存明細</span>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button type="button" id="btnOpenCatModal" class="btn-text-link" style="color: #f87171; font-size: 12px;">🗑️ 批次刪除</button>
            <button type="button" id="btnToggleSummary" class="btn-text-link">收起 ▲</button>
        </div>
    </h2>

    <!-- 分類標籤容器 -->
    <div id="categoryChips" class="chips-container"></div>
    
    <!-- 庫存明細列表容器 -->
    <div id="inventoryStockSummary" style="padding: 0 12px; margin-bottom: 16px;"></div>

    <h2>📝 物料入出庫異動</h2>
    <div class="card" id="txCard">
        <div class="form-group">
            <label>1. 物料名稱</label>
            <div class="search-container" style="display: flex; gap: 8px;">
                <input type="text" id="txMaterialName" list="materialListOptions" placeholder="請輸入至少一個字以觸發快選" style="flex: 1;">
                <datalist id="materialListOptions"></datalist>
                <button type="button" id="btnAddMasterQuick" class="btn-icon" title="新增物料主檔" style="padding: 8px 14px; font-size: 18px; background: #2563eb; color: white; border: none; border-radius: 6px;">＋</button>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>2. 厚度 (mm)</label>
                <input type="text" id="txThickness" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>3. 數量</label>
                <input type="number" id="txQty" placeholder="0">
            </div>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-in" id="btnIn">📥 入庫</button>
            <button type="button" class="btn btn-out" id="btnOut">📤 出庫</button>
        </div>
    </div>

    <!-- 物料主檔管理 Modal -->
    <div id="masterModal" class="modal">
        <div class="modal-content" id="masterModalContent">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="modal-title" id="masterModalHeaderTitle" style="font-size: 15px; font-weight: bold;">📦 物料主檔管理</span>
                    <button type="button" id="btnAddCustomCategory" style="background: #166534; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;" title="新增分類">＋</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" id="btnCancelEditMaster" style="display: none; background: #b91c1c; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;">取消編輯</button>
                    <button type="button" class="close-btn" id="btnCloseMaster" style="background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer;">&times;</button>
                </div>
            </div>

            <div id="editingBadge" style="display: none; background: #1e3a8a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; color: #93c5fd;"></div>

            <div id="masterFormSection">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #ccc;">物料分類</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="newMasterCategory" list="categoryListOptions" placeholder="選擇或輸入分類" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                        <datalist id="categoryListOptions"></datalist>
                        <button type="button" id="btnOpenCategoryPicker" style="background: #374151; color: white; border: none; padding: 0 10px; border-radius: 6px; font-size: 12px; cursor: pointer;">選擇</button>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #ccc;">物料名稱</label>
                    <input type="text" id="newMasterName" placeholder="物料名稱 (如: 1870A)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                </div>

                <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <input type="text" id="newMasterThickness" placeholder="厚度 (如: 0.125)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <input type="text" id="newMasterSize" placeholder="尺寸 (如: 930X680M)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                    </div>
                </div>

                <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 14px;">
                    <div class="form-group" style="flex: 1;">
                        <label style="font-size: 13px; color: #ccc;">安全庫存</label>
                        <input type="number" id="newMasterSafetyStock" placeholder="" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label style="font-size: 13px; color: #ccc;">MOQ (最低訂購量)</label>
                        <input type="number" id="newMasterMoq" placeholder="" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
                    </div>
                </div>
                <button type="button" id="btnSaveNewMaster" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">儲存至物料主檔</button>
            </div>
        </div>
    </div>

    <!-- 分類快選彈窗 Modal -->
    <div id="categoryPickerModal" class="modal">
        <div class="modal-content" style="max-width: 350px; background: #1e1e1e; padding: 16px; border-radius: 8px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span class="modal-title" style="font-size: 15px; font-weight: bold;">🏷️ 選擇物料分類</span>
                <button type="button" class="close-btn" id="btnCloseCategoryPicker" style="background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer;">&times;</button>
            </div>
            <div id="categoryPickerGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 40vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 分類批次刪除 Modal -->
    <div id="catBatchModal" class="modal">
        <div class="modal-content" style="max-width: 400px; background: #1e1e1e; padding: 16px; border-radius: 8px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span class="modal-title" style="font-size: 15px; font-weight: bold;">🗑️ 批次勾選要刪除的分類</span>
                <button type="button" class="close-btn" id="btnCloseCatBatchModal" style="background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer;">&times;</button>
            </div>
            <div style="font-size: 11px; color: #888; margin-bottom: 8px;">勾選要刪除的分類（該分類下物料將自動移至「其他」）：</div>
            <div id="catCheckboxList" style="max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;"></div>
            <button type="button" id="btnConfirmBatchDelete" style="width: 100%; padding: 10px; background: #c62828; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">確認刪除勾選的分類</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
